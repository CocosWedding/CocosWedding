.accommodation-section {
  padding: 140px 7vw;
  background: #f4f0e7;
  color: #30382d;
}

.section-intro {
  max-width: 720px;
  margin: 0 auto 80px;
  text-align: center;
}

.section-number {
  display: block;
  margin-bottom: 20px;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 15px;
  letter-spacing: 3px;
  color: #9a8060;
}

.eyebrow {
  margin: 0 0 12px;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 500;
}

.section-intro h2 {
  margin: 0 0 25px;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(52px, 7vw, 90px);
  line-height: .9;
  font-weight: 400;
}

.section-description {
  max-width: 570px;
  margin: 0 auto;
  font-family: Arial, sans-serif;
  font-size: 15px;
  line-height: 1.8;
  color: #64685e;
}

.hotel-grid {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 35px;
}

.hotel-card {
  background: #faf8f2;
  overflow: hidden;
  box-shadow: 0 15px 50px rgba(48, 56, 45, .08);
}

.hotel-image {
  height: 340px;
  position: relative;
  background-size: cover;
  background-position: center;
}

.hotel-image-doubletree {
  background-image: linear-gradient(rgba(30,40,32,.15),rgba(30,40,32,.15)), url("public/9B0F43FB-6A7C-4DCD-920B-31859924643D.jpeg");
}

.hotel-image-cmc {
  background-image: linear-gradient(rgba(30,40,32,.15),rgba(30,40,32,.15)), url("public/B5B2B64B-88DF-4BE5-A540-5CF437E65681.jpeg");
}

.hotel-label {
  position: absolute;
  top: 25px;
  left: 25px;
  padding: 8px 14px;
  background: rgba(250, 248, 242, .92);
  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
}

.hotel-content {
  padding: 42px 42px 45px;
}

.hotel-location {
  margin: 0 0 10px;
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 3px;
  color: #9a8060;
}

.hotel-content h3 {
  margin: 0 0 28px;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 38px;
  line-height: 1;
  font-weight: 500;
}

.hotel-highlight {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 25px;
  padding-bottom: 25px;
  border-bottom: 1px solid #ddd7c9;
}

.hotel-highlight span {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 58px;
  line-height: .8;
  color: #68735d;
}

.hotel-highlight small {
  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
}

.hotel-description {
  margin: 0 0 18px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 1.8;
  color: #64685e;
}

.hotel-details {
  display: flex;
  flex-direction: column;
  gap: 13px;
  margin-bottom: 30px;
}

.detail {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.detail-icon {
  flex-shrink: 0;
  margin-top: 3px;
  color: #9a8060;
  font-size: 11px;
}

.detail p {
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 12px;
  line-height: 1.6;
  color: #555a51;
}

.detail strong {
  font-weight: 600;
  color: #30382d;
}

.detail.important {
  margin-top: 8px;
  padding: 15px;
  background: #eeeadf;
}

.detail.important .detail-icon {
  font-family: Arial, sans-serif;
  font-weight: bold;
}

.hotel-contact {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 28px;
}

.contact-link {
  color: #30382d;
  font-family: Arial, sans-serif;
  font-size: 11px;
  text-decoration: none;
  transition: opacity .3s ease;
}

.contact-link:hover {
  opacity: .6;
}

.hotel-button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background: #30382d;
  color: #f8f5ed;
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  text-decoration: none;
  transition: all .3s ease;
}

.hotel-button span {
  font-size: 18px;
  line-height: 0;
}

.hotel-button:hover {
  background: #68735d;
}

.accommodation-note {
  max-width: 700px;
  margin: 70px auto 0;
  padding-top: 35px;
  border-top: 1px solid #d8d1c2;
  display: flex;
  gap: 18px;
  align-items: flex-start;
}

.note-symbol {
  color: #9a8060;
  font-size: 13px;
  margin-top: 4px;
}

.accommodation-note p {
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 12px;
  line-height: 1.8;
  color: #686c64;
}

  .accommodation-note { margin-top: 50px; }
}
